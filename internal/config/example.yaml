# hfy — a simple harness as a service. Your agents, served over HTTP.
# ${VAR} reads the environment, ${VAR:-default} supplies a fallback, $$ is a literal $.

server:
  listen: ":8080"                    # optional (default :8080)
  secret: ${HFY_SERVER_SECRET}       # required: your backend's key (conversations, grants)
  # cors_origins: ["https://shop.example.com"]  # web pages that may call the client routes; ["*"] = any

database:                             # conversations, events, jobs, trace, vectors (pgvector 0.8.0+)
  url: ${DATABASE_URL}

# metrics:                           # optional; omit = off. Every process (serve and
#   listen: "127.0.0.1:9090"         # queue:work) serves /metrics, /healthz, /readyz here

# queue:                             # optional; defaults shown
#   workers: 4
#   lease: 30s
#   max_attempts: 3

# retention:                         # optional; default shown
#   trace: 30d                       # ephemeral events, outbound_requests, ended grants

providers:                           # OpenAI-compatible: URL + key + idle timeout
  local:
    url: http://localhost:11434/v1
    timeout: 60s
  # openrouter:
  #   url: https://openrouter.ai/api/v1
  #   api_key: ${OPENROUTER_API_KEY}
  # mock:                            # in-process fake for dev/testing: no server needed
  #   type: mock
  #   mock: { reply: "Hello from mock", embed_dimensions: 768 }

# mcp:                               # ALL external tools come from here
#   files:
#     type: local
#     command: [mcp-filesystem, /data]
#     environment: { LOG: "1" }      # its only variables besides PATH, HOME, locale
#     timeout: 2m                    # longest a tool call may take (default 2m)
#     approval: [refund, delete_*]   # server-owned policy: tool names WITHOUT
#                                    # the server prefix; matching calls wait
#                                    # for approval for EVERY agent (adding to
#                                    # agent.approval; hfy core tools never wait)
#     approve_destructive: true      # wait on tools the server's annotations say
#                                    # are destructive (readOnlyHint not true AND
#                                    # destructiveHint explicitly true)
#   search:
#     type: remote
#     url: https://search.example.com/mcp
#     headers: { Authorization: "Bearer ${SEARCH_TOKEN}" }

# embeddings:                        # optional; omit = conversation_search is disabled
#   model: local/nomic-embed-text
#   dimensions: 768

# attachments:                       # optional; omit = attachments are rejected
#   allowed_hosts: [cdn.example.com, "*.s3.amazonaws.com"]
#   types: [image/png, image/jpeg, image/webp]
#   max_bytes: 5MB
#   max_count: 10                    # per message

# filesystem:                        # optional; omit = file uploads are disabled
#   dsn: s3://hfy-uploads?region=eu-central-1  # region= is required for s3 dsn
#   # dsn: file:///var/lib/hfy/files # alternative; requires public_url below
#   public_url: https://hfy.example.com        # http(s) base of hfy-served file URLs; required for file://
#   types: [image/png, image/jpeg, application/pdf]
#   max_bytes: 10MB                   # also bounds upload slot sizes
#   upload_ttl: 5m                    # default; slots are deleted after this + 1h
#   download_ttl: 15m                 # default; download signature lifetime

agent:                               # the default agent ("main")
  model: local/gemma3:1b             # <provider>/<model>
  settings: { temperature: 0.2, context_window: 8192, vision: false }
  system: |
    You help {{user_name}} at {{company}}.
  vars:                              # set only by your backend, in the grant; never by clients
    user_name: { default: "there" }  # or required: true
    company:   { default: "Acme" }
  limits:                            # per turn; every field optional
    steps: 20
    total_tokens: 20000
    timeout: 120s
  # approval:                        # omit = no approvals
  #   tools: [files.write_*, files.delete_*]
  #   timeout: 10m
  # ask_user: true                    # the agent may pause a turn asking the viewer
  #                                   # structured questions (hfy.ask_user); timeout above or 30m
  # mcp: [files, search]             # optional; omit = all MCP servers via tool search

# agents:                            # more agents, same fields as agent; a grant
#   store:                           # picks one: {"agent": "store"}
#     model: local/gemma3:1b
#     settings: { context_window: 8192 }
#     system: You answer for {{shop}}.
#     vars: { shop: { required: true } }

# subagents:                         # every agent may call them as hfy.<name>
#   refunds:
#     description: Decides whether an order is eligible for a refund
#     model: local/gemma3:1b
#     system: You are a refunds specialist. Answer concisely.
#     mcp: [search]
#     limits: { steps: 10 }

# embed:                             # optional; embedded chat UI at /embed, defaults shown
#   lang: en                           # language tag; omit = browser default
#   dir: auto                          # auto | ltr | rtl
#   theme: auto                        # light | dark | auto
#   accent: "#6366f1"                  # hex color
#   density: comfortable               # comfortable | compact
#   layout: bubbles                    # bubbles | transcript
#   tool_calls: summary                # hidden | summary (friendly row, no JSON) | details (args and results)

# summarizer:                        # harness-triggered, never callable by the model
#   model: local/gemma3:1b
#   settings: { temperature: 0, context_window: 8192 }
#   keep_recent: 3                   # last N turns stay verbatim
#   # system: ...                    # optional; the embedded default is used otherwise
